<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Prompt Project Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="elevator-scene">
        <div class="elevator">
            <div class="elevator-doors">
                <div class="door left-door"></div>
                <div class="door right-door"></div>
            </div>
            <div class="elevator-interior">
                <div class="back-wall"></div>
                <div class="side-wall left-wall"></div>
                <div class="side-wall right-wall"></div>
                <div class="floor"></div>
                <div class="ceiling"></div>
                <div class="control-panel">
                    <div class="floor-buttons">
                        <!-- Floor buttons will be added dynamically -->
                    </div>
                    <div class="close-button">
                        <i class="fas fa-times"></i>
                    </div>
                </div>
                <div class="iframe-container">
                    <iframe id="project-frame" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <div class="loading-screen">
        <div class="loading-text">Loading Elevator...</div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <div class="prompt-badge">
        <span class="badge-circle">1</span>
        <span class="badge-text">prompt</span>
    </div>

    <div class="fullscreen-overlay">
        <div class="fullscreen-controls">
            <button class="exit-fullscreen">Exit</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
